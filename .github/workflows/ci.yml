name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }}, otel ${{ matrix.otel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The advertised minimum (package.json engines; ai@7 and vitest 5 need >=22.12) and the latest 24.x.
        node: ["22.12.0", "24"]
        # ADR-001: users are split across OTel JS lines. legacy = API 1.9 (SDK 2.x), modern = API 1.10 (SDK 3.0).
        otel: [legacy, modern]
    steps:
      # Actions are pinned by commit SHA, not tag: tags are mutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Switch to the legacy OpenTelemetry API line
        if: matrix.otel == 'legacy'
        run: pnpm add -D @opentelemetry/api@1.9.1
      - run: pnpm peers check
      - run: pnpm check
